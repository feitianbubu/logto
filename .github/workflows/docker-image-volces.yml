name: Publish Docker image (Volcano CR)

# 构建当前源码并推送到火山引擎镜像仓库,供 k8s 发布使用。
# 推送走 docker.everai.cloud 加速域名(volc-dcdn),它与
# docker-cn-shanghai.cr.volces.com 是同一个 Harbor 后端,
# 推完之后 k8s 用 volces 域名照样能拉到同一 tag。
# 凭据命名与 clinx 仓库保持一致:MIRROR_USERNAME / MIRROR_PASSWORD。
#
# 触发方式:
#   1. Actions 页面手动 workflow_dispatch,选择要构建的分支(如 dev),
#      镜像 tag 默认用 git describe 生成(如 v1.41.0-106-g1e6b530)
#   2. 推送 deploy-* 格式的 git tag,镜像 tag 为去掉 deploy- 前缀的部分

on:
  push:
    tags:
      - 'deploy-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom image tag (optional, defaults to git describe)'
        required: false
        type: string

env:
  REGISTRY: docker.everai.cloud
  IMAGE_NAME: skynono/logto

jobs:
  build_and_push:
    name: Build & push AMD64 Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          # fork 上没有上游的 v* tag,git describe 需要从上游取(公开仓库,无需凭据)
          git remote add upstream https://github.com/logto-io/logto.git
          git fetch upstream --tags --force --quiet
          if [[ $GITHUB_REF == refs/tags/deploy-* ]]; then
            TAG=${GITHUB_REF#refs/tags/deploy-}
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(git describe --tags --match 'v*' --always)
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Volcano CR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
